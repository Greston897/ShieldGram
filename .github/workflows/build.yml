name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CI_USE_CCACHE: '1'
  CCACHE_DIR: /home/runner/.ccache

jobs:
  build:
    name: Assemble afat release APK
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout sources (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build caching)
        uses: gradle/actions/setup-gradle@v4

      # ccache is content-addressed: unlike the .cxx build dir it stays valid
      # across fresh checkouts (git sets new mtimes on every checkout, which
      # would make ninja recompile everything). First run populates the cache,
      # later runs with unchanged jni/ code reuse it and get much faster.
      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: /home/runner/.ccache
          key: ccache-v1-${{ github.run_id }}
          restore-keys: |
            ccache-v1-

      # AGP auto-installs these into the SDK on first use; caching them
      # skips a multi-minute download+unpack on every run
      - name: Cache NDK and CMake
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/lib/android/sdk/ndk
            /usr/local/lib/android/sdk/cmake
          key: sdk-ndk-27.2.12479018-cmake-3.22.1-v1

      # x86 / x86_64 assembly needs nasm/yasm on the host
      - name: Install host tools (nasm, yasm, ccache)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm yasm ccache

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=8G
          ccache --set-config=compression=false
          ccache --set-config=compiler_check=content
          ccache -z
          ccache -s

      - name: Quick Java compile check
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --console=plain --stacktrace 2>&1 | tee quick-check.log

      - name: Build release APK (afat, all ABIs)
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --console=plain --stacktrace 2>&1 | tee build.log
          ccache -s

      - name: Collect APK
        run: |
          mkdir -p output
          cp -v TMessagesProj_App/build/outputs/apk/afat/release/*.apk output/
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: StormGram-afat-release-${{ github.sha }}
          path: output/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        if: success()
        run: |
          SIZE=$(du -h output/*.apk | cut -f1)
          echo "### Build finished OK" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`app.apk\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- App name: StormGram" >> $GITHUB_STEP_SUMMARY
          echo "- Version: 13.2.2 (7303)" >> $GITHUB_STEP_SUMMARY
          echo "- Signed with the bundled release keystore" >> $GITHUB_STEP_SUMMARY
          {
            echo '<details><summary>ccache statistics</summary>'
            echo '```'
            ccache -s
            echo '```'
            echo '</details>'
          } >> $GITHUB_STEP_SUMMARY

      # Makes the failure readable from restricted environments:
      # annotations (via API) + the log tail committed to the branch.
      - name: Publish failure details
        if: failure()
        run: |
          LOG=build.log
          if [ ! -f "$LOG" ]; then LOG=quick-check.log; fi
          {
            echo "### Build failed - relevant log excerpt"
            echo '```'
            awk '/What went wrong/{f=1} f{print; n++} n>60{exit}' "$LOG" 2>/dev/null | tail -n 60 || true
            echo '--- last lines ---'
            tail -n 40 "$LOG" 2>/dev/null || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          EXCERPT=$((awk '/What went wrong/{f=1} f{print; n++} n>20{exit}' "$LOG" 2>/dev/null | head -n 20; tail -n 20 "$LOG" 2>/dev/null) | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 3500)
          echo "::error title=Build failed::$EXCERPT"
          tail -c 400000 "$LOG" > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-failure.log || true
          git commit -m "CI: attach build failure log [skip ci]" || true
          git push || true
