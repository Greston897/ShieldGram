name: Build ShieldGram APK

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main
  workflow_dispatch:
    inputs:
      build_variant:
        description: 'APK variant to build'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - standalone
          - release

concurrency:
  group: shieldgram-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile ShieldGram (${{ inputs.build_variant || 'debug' }})
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      ANDROID_API_LEVEL: 36
      ANDROID_BUILD_TOOLS_VERSION: 36.0.0
      ANDROID_NDK_VERSION: 27.2.12479018
      ANDROID_CMAKE_VERSION: 3.22.1
      ANDROID_CMDLINE_TOOLS_VERSION: 15859902

    steps:
      - name: Free Runner Disk Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet \
                      /usr/local/lib/android/sdk/ndk/* \
                      /opt/ghc \
                      /opt/hostedtoolcache/CodeQL || true
          df -h

      - name: Install Native Build Dependencies (NASM & Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends nasm ninja-build unzip curl

      - name: Checkout ShieldGram Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Initialize Git Submodules
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive --depth=1 --jobs=4 || \
            git submodule update --init --recursive --jobs=4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Android SDK 36, NDK 27.2 & CMake 3.22.1
        run: |
          export ANDROID_SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          mkdir -p "${ANDROID_SDK_ROOT}/cmdline-tools"
          cd /tmp
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-${ANDROID_CMDLINE_TOOLS_VERSION}_latest.zip" -o cmdtools.zip
          unzip -q cmdtools.zip
          rm -rf "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          mv cmdline-tools "${ANDROID_SDK_ROOT}/cmdline-tools/latest"
          rm -f cmdtools.zip

          yes | "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" --licenses > /dev/null
          "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS_VERSION}" \
            "ndk;${ANDROID_NDK_VERSION}" \
            "cmake;${ANDROID_CMAKE_VERSION}"

          echo "ANDROID_HOME=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT}" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/${ANDROID_NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Native CMake/NDK Build (.cxx)
        uses: actions/cache@v4
        with:
          path: TMessagesProj/.cxx
          key: shieldgram-cxx-${{ env.ANDROID_NDK_VERSION }}-${{ hashFiles('TMessagesProj/jni/CMakeLists.txt', 'TMessagesProj/jni/voip/CMakeLists.txt', '.gitmodules') }}
          restore-keys: |
            shieldgram-cxx-${{ env.ANDROID_NDK_VERSION }}-

      - name: Configure Optional Telegram API Secrets
        env:
          TELEGRAM_APP_ID: ${{ secrets.TELEGRAM_APP_ID }}
          TELEGRAM_APP_HASH: ${{ secrets.TELEGRAM_APP_HASH }}
        run: |
          if [ -n "$TELEGRAM_APP_ID" ] && [ -n "$TELEGRAM_APP_HASH" ]; then
            echo "Applying custom TELEGRAM_APP_ID and TELEGRAM_APP_HASH from secrets..."
            sed -i "s/public static int APP_ID = .*/public static int APP_ID = ${TELEGRAM_APP_ID};/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
            sed -i "s/public static String APP_HASH = .*/public static String APP_HASH = \"${TELEGRAM_APP_HASH}\";/" \
              TMessagesProj/src/main/java/org/telegram/messenger/BuildVars.java
          else
            echo "Using repository BuildVars.java configuration."
          fi

      - name: Compile ShieldGram APK
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

          VARIANT="${{ inputs.build_variant || 'debug' }}"
          mkdir -p dist

          if [ "$VARIANT" = "standalone" ]; then
            ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone \
              --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            APK_SRC=$(find TMessagesProj_AppStandalone/build/outputs/apk -name "*.apk" | head -n 1)
          elif [ "$VARIANT" = "release" ]; then
            ./gradlew :TMessagesProj_App:assembleAfatRelease \
              --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            APK_SRC=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          else
            ./gradlew :TMessagesProj_App:assembleAfatDebug \
              --no-daemon --stacktrace \
              -Dorg.gradle.jvmargs="-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
            APK_SRC=$(find TMessagesProj_App/build/outputs/apk -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_SRC" ] || [ ! -f "$APK_SRC" ]; then
            echo "ERROR: Built APK not found!"
            exit 1
          fi

          OUT_APK="dist/ShieldGram-13.1.1-afat-${VARIANT}.apk"
          cp "$APK_SRC" "$OUT_APK"
          SHA256=$(sha256sum "$OUT_APK" | awk '{print $1}')
          SIZE=$(du -h "$OUT_APK" | awk '{print $1}')

          {
            echo "### ShieldGram Build Succeeded"
            echo "- **Artifact**: \`$(basename "$OUT_APK")\`"
            echo "- **Variant**: \`${VARIANT}\` (\`armeabi-v7a\`, \`arm64-v8a\`, \`x86\`, \`x86_64\`)"
            echo "- **Size**: \`${SIZE}\`"
            echo "- **SHA-256**: \`${SHA256}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload ShieldGram APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGram-APK-${{ inputs.build_variant || 'debug' }}
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 14
