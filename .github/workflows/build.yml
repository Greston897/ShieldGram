name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: write

jobs:
  build:
    name: Assemble afat release APK
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout sources (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build caching)
        uses: gradle/actions/setup-gradle@v4

      # x86 / x86_64 assembly needs nasm/yasm on the host
      - name: Install host tools (nasm, yasm)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends nasm yasm

      - name: Quick Java compile check
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj:compileReleaseJavaWithJavac --console=plain --stacktrace 2>&1 | tee quick-check.log

      - name: Build release APK (afat, all ABIs)
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Collect APK
        run: |
          mkdir -p output
          cp -v TMessagesProj_App/build/outputs/apk/afat/release/*.apk output/
          ls -lh output/

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGram-afat-release-${{ github.sha }}
          path: output/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Summary
        if: success()
        run: |
          SIZE=$(du -h output/*.apk | cut -f1)
          echo "### Build finished OK" >> $GITHUB_STEP_SUMMARY
          echo "- APK: \`app.apk\` ($SIZE)" >> $GITHUB_STEP_SUMMARY
          echo "- Version: 13.2.2 (7303)" >> $GITHUB_STEP_SUMMARY
          echo "- Signed with the bundled release keystore" >> $GITHUB_STEP_SUMMARY

      # Makes the failure readable from restricted environments:
      # annotations (via API) + the log tail committed to the branch.
      - name: Publish failure details
        if: failure()
        run: |
          LOG=build.log
          if [ ! -f "$LOG" ]; then LOG=quick-check.log; fi
          {
            echo "### Build failed - relevant log excerpt"
            echo '```'
            awk '/What went wrong/{f=1} f{print; n++} n>60{exit}' "$LOG" 2>/dev/null | tail -n 60 || true
            echo '--- last lines ---'
            tail -n 40 "$LOG" 2>/dev/null || true
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
          EXCERPT=$((awk '/What went wrong/{f=1} f{print; n++} n>20{exit}' "$LOG" 2>/dev/null | head -n 20; tail -n 20 "$LOG" 2>/dev/null) | sed ':a;N;$!ba;s/\n/%0A/g' | head -c 3500)
          echo "::error title=Build failed::$EXCERPT"
          tail -c 400000 "$LOG" > ci-build-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-build-failure.log || true
          git commit -m "CI: attach build failure log [skip ci]" || true
          git push || true
