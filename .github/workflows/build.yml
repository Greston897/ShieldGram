name: Compile ShieldGram

on:
  workflow_dispatch:
  push:
    branches:
      - 'arena/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile Kotlin Compose and Java
    runs-on: ubuntu-latest
    timeout-minutes: 330

    steps:
      - name: Checkout sources (with submodules)
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile Kotlin Compose and Java sources
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :TMessagesProj:compileReleaseKotlin :TMessagesProj:compileReleaseJavaWithJavac --console=plain --stacktrace 2>&1 | tee compile.log

      - name: Assemble Android APK (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          ./gradlew :TMessagesProj_App:assembleAfatRelease --console=plain --stacktrace 2>&1 | tee build.log

      - name: Upload APK artifact (manual runs only)
        if: github.event_name == 'workflow_dispatch' && success()
        uses: actions/upload-artifact@v4
        with:
          name: ShieldGram-afat-${{ github.sha }}
          path: TMessagesProj_App/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
          compression-level: 0

      - name: Publish failure details
        if: failure()
        run: |
          LOG=build.log
          if [ ! -f "$LOG" ]; then LOG=compile.log; fi
          {
            echo "### Build failed - relevant log excerpt"
            echo '```'
            awk '/What went wrong/{f=1} f{print; n++} n>60{exit}' "$LOG" 2>/dev/null | tail -n 60 || true
            echo '--- last lines ---'
            tail -n 40 "$LOG" 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          DIAGNOSTICS=$(grep -E '(^e: |^w: |error:|Unresolved reference|Compilation error)' "$LOG" 2>/dev/null | tail -n 40 || true)
          EXCERPT=$((printf '%s\n' "$DIAGNOSTICS"; awk '/What went wrong/{f=1} f{print; n++} n>20{exit}' "$LOG" 2>/dev/null | head -n 20; tail -n 20 "$LOG" 2>/dev/null) | sed ':a;N;$!ba;s/%/%25/g;s/\r/%0D/g;s/\n/%0A/g' | head -c 5000)
          echo "::error title=Build failed::$EXCERPT"
          tail -c 400000 "$LOG" > ci-build-failure.log

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-build-failure-${{ github.sha }}
          path: ci-build-failure.log
          if-no-files-found: ignore
